
services:
  app:
    build: .
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: blog
      DB_USERNAME: root
      DB_PASSWORD: ""
    command: >
      sh -c "composer install &&
      php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  vendor_data:
